# `docker compose up` starts the whole stack:
#   postgres  where tickets, orders and refunds live
#   mailpit   catches every email the app sends and delivers none (web UI on port 8025)
#   python    the Refund Bot app (API docs on http://localhost:8000/docs)
#
#   docker compose up -d --wait                      start everything
#   docker compose --profile test run --rm test      run the tests against the real Postgres and Mailpit
#   docker compose down -v                           stop and delete the data
#
# Everything is bound to 127.0.0.1 and the credentials are throwaway demo values.
# The app creates its own tables on start (Alembic), so there is no schema file to mount.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: refund
      POSTGRES_PASSWORD: refund
      POSTGRES_DB: refund
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "refund", "-d", "refund"]
      interval: 3s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 10

  python:
    build: ./python
    image: refund-agent-tutorial-python
    environment:
      DATABASE_URL: postgresql://refund:refund@postgres:5432/refund
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    profiles: ["test"]
    build: ./python
    image: refund-agent-tutorial-python
    environment:
      POSTGRES_TEST_URL: postgresql://refund:refund@postgres:5432/refund_test
      MAILPIT_API: http://mailpit:8025
      MAILPIT_SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    entrypoint: ["uv", "run", "--no-sync", "pytest", "-q"]

volumes:
  pgdata:
