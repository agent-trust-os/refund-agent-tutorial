[project]
name = "refund-langgraph"
version = "0.1.0"
description = "Refund Bot on LangGraph: the same support agent as python/, with a LangGraph graph, LangChain tools, FastAPI, SQLAlchemy and Mailpit."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langgraph>=0.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=0.3"]

[project.scripts]
refund-langgraph = "refund_langgraph.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "refund_langgraph"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
