[project]
name = "refund-bot"
version = "0.1.0"
description = "Refund Bot in plain Python: the agent loop on the shared core, the base for the AgentTrust tutorial."
requires-python = ">=3.12"
dependencies = ["refund-core[postgres]"]

[project.scripts]
refund-bot = "refund_bot.__main__:main"

[tool.uv.sources]
refund-core = { path = "../core", editable = true }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
