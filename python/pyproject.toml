[project]
name = "refund-bot"
version = "0.1.0"
description = "Refund Bot: a customer-support agent on a mock LLM, with FastAPI, SQLAlchemy and Mailpit. The base for the AgentTrust tutorial."
requires-python = ">=3.12"
dependencies = [
    "agentrust-py==0.0.4",
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
refund-bot = "app.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
