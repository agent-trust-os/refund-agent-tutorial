[project]
name = "refund-bot"
version = "0.1.0"
description = "Refund Bot in plain Python: a support agent on a mock LLM with Postgres and Mailpit, the base for the AgentTrust tutorial."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[project.scripts]
refund-bot = "refund_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
